
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090711">
    <title>ZARI AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <header class="top-bar">
            <div class="brand">
                <img src="ZARI-logo.png" alt="ZARD AI logo" class="brand-icon">
                <div>
                    <h1>ZARI AI</h1>
                    <span>Your personal AI</span>
                </div>
            </div>

            <button id="newChatBtn" class="new-chat-btn">
                + New chat
            </button>
        </header>

        <main class="chat-container" id="chatArea">

            <section class="welcome-screen" id="welcomeScreen">

                <h2>Sasa, I'm ZARI.</h2>

                <p>
                    Your personal AI assistant.
                    What can I help you with today?
                </p>

              
<div class="suggestions">
    <button class="suggestion">✧ Ideas</button>
    <button class="suggestion">▤ Create</button>
    <button class="suggestion">&lt;/&gt; Code</button>
    <button class="suggestion">◎ Explore</button>
</div>

                    <button class="suggestion">
                        Explain something to me
                    </button>

                    <button class="suggestion">
                        Help me write something
                    </button>

                    <button class="suggestion">
                        Give me creative ideas
                    </button>
                </div>
            </section>

        </main>

        <footer class="input-section">

            <div class="input-wrapper">
                <textarea
                    id="userInput"
                    placeholder="ONGEA NA ZARI..."
                    rows="1"
                ></textarea>

                <button id="sendButton" type="button">
                    ↑
                </button>
            </div>

            <p class="disclaimer">
                ZARI can make mistakes. Check important information.
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
